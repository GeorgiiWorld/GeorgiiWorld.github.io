<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QuestBook — экономика очков</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">

  <meta name="theme-color" content="#0f1115">
</head>
<body>
  <div class="container">
    <h1>QuestBook</h1>
    <p class="muted">Преврати жизнь в игру</p>

    <!-- Баланс -->
    <div class="card">
      <h2>Баланс</h2>
      <div class="row" style="justify-content:space-between; align-items:center">
        <div class="balance" id="balance">0</div>
        <button onclick="resetAll()">Сброс</button>
      </div>
    </div>

    <!-- Доход / расход -->
    <div class="card">
      <h2>Доход / расход</h2>
      <div class="row">
        <input id="reason" placeholder="Причина" />
        <input id="amount" type="number" placeholder="Очки (+ / -)" />
        <button onclick="logCustom()">Записать</button>
      </div>
      
    </div>

    <!-- Каталог наград -->
    <div class="card">
      <h2>Каталог наград</h2>
      <div class="row">
        <input id="rewardName" placeholder="Награда" />
        <input id="rewardCost" type="number" placeholder="Цена" />
        <button onclick="addReward()">Добавить</button>
      </div>
      <div id="rewards" class="card-list"></div>
    </div>

    <!-- Каталог квестов -->
    <div class="card">
      <h2>Каталог квестов</h2>
      <div class="row">
        <input id="questName" placeholder="Квест" />
        <input id="questReward" type="number" placeholder="Очки за завершение" />
        <button onclick="addQuest()">Добавить</button>
      </div>
      <div id="quests" class="card-list"></div>
    </div>

    <!-- Журнал -->
    <div class="card">
      <h2>Журнал</h2>
      <table>
        <thead>
          <tr><th>Дата</th><th>Причина</th><th>Δ</th><th>Баланс</th><th></th></tr>
        </thead>
        <tbody id="log"></tbody>
      </table>
    </div>
      <div>
        <input
        type="file"
        id="importFile"
        accept="application/json"
        style="display:none"
      />
      <button onclick="document.getElementById('importFile').click()">Импорт</button>
      <button id="exportBtn">Экспорт</button>
      </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/importExport.js"></script>
  <script src="js/render.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
